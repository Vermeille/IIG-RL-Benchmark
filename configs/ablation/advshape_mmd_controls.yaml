# @package algorithm
# Fair-control ablation: keep AdvShape learner/teacher dynamics, but reuse the
# benchmark MMD regularization coefficients exactly.
# MMD inherits PPO entropy coefficient 0.05 and adds a fixed backward/reverse
# KL KL(pi_new || pi_rollout) coefficient of 0.05.
agent_entropy_strength: 0.05
environment_entropy_strength: 0.05
perplexity_adaptation_rate: 0.0
entropy_baseline_ratio: 1.0
kl_strength: 0.05
kl_adaptation_rate: 0.0
