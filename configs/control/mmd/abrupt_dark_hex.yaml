# @package algorithm
# AdvShape dynamics with the benchmark's best MMD hyperparameters for
# abrupt_dark_hex (minimum final exploitability selection).
# Learner entropy reuses MMD/PPO's selected coefficient; teacher entropy keeps
# the fixed AdvShape structural asymmetry at 5x, with no adaptive PPL controller.
learning_rate: 0.0000625
lr_schedule: benchmark_linear
weight_decay: 0.0
adam_beta1: 0.9
adam_beta2: 0.999
adam_eps: 0.00001
num_envs: 8
num_steps: 32
num_minibatches: 32
update_epochs: 2
warmup_updates: 0
gamma: 0.99
gae_lambda: 0.95
value_lambda: 0.95
clip_coef: 0.8
clip_vloss: true
vf_coef: 0.0625
max_grad_norm: 0.5
agent_entropy_strength: 0.05
environment_entropy_strength: 0.25
perplexity_adaptation_rate: 0.0
entropy_baseline_ratio: 1.0
kl_strength: 0.1
kl_adaptation_rate: 0.0
